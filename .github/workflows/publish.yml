name: Deploy Dexora to Production

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Dexora.Web/Dexora.Web.csproj

      - name: Build
        run: dotnet build Dexora.Web/Dexora.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Dexora.Web/Dexora.Web.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: './publish/'
