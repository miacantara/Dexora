name: Deploy Ketchump to Production

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Ketchump.Web/Ketchump.Web.csproj

      - name: Build
        run: dotnet build Ketchump.Web/Ketchump.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Ketchump.Web/Ketchump.Web.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBDEPLOY_SITE }}
          server-computer-name: ${{ secrets.WEBDEPLOY_SERVER }}
          server-username: ${{ secrets.WEBDEPLOY_USERNAME }}
          server-password: ${{ secrets.WEBDEPLOY_PASSWORD }}
          source-path: 'publish'
